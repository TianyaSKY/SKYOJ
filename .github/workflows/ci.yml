name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile backend sources
        run: uv run python -m compileall -q backend/app backend/tests

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: ci-secret-key-for-github-actions
          CELERY_BROKER_URL: memory://
        run: uv run python -m pytest -q backend/tests

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: oj_db
          MYSQL_USER: skyoj
          MYSQL_PASSWORD: ci-app-password
          DATABASE_URL: mysql+pymysql://skyoj:ci-app-password@mysql:3306/oj_db
          SECRET_KEY: ci-secret-key-for-github-actions
          CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
          FRONTEND_PORT: "18080"
        run: docker compose config --quiet
