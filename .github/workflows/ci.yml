name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile backend sources
        run: uv run python -m compileall -q backend/app backend/tests

      - name: Validate migration on isolated database
        env:
          DATABASE_URL: sqlite:////tmp/skyoj-migrations.sqlite
          SECRET_KEY: ci-migration-secret-key
        run: |
          uv run alembic -c backend/alembic.ini upgrade head
          uv run alembic -c backend/alembic.ini check

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: ci-secret-key-for-github-actions
          CELERY_BROKER_URL: memory://
        run: uv run python -m pytest -q backend/tests

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: oj_db
          MYSQL_USER: skyoj
          MYSQL_PASSWORD: ci-app-password
          DATABASE_URL: mysql+pymysql://skyoj:ci-app-password@mysql:3306/oj_db
          SECRET_KEY: ci-secret-key-for-github-actions
          CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
          FRONTEND_PORT: "18080"
        run: docker compose config --quiet

  frontend-unit-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:unit

  frontend-e2e-tests:
    name: Frontend E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_API_URL: http://127.0.0.1:5015
      DATABASE_URL: sqlite:////tmp/skyoj-e2e.sqlite
      SECRET_KEY: ci-e2e-secret-key-for-github-actions
      CELERY_BROKER_URL: memory://
      REDIS_URL: ""
      UPLOAD_FOLDER: /tmp/skyoj-e2e-uploads
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Prepare isolated E2E database
        run: |
          uv sync --frozen
          uv run python backend/scripts/seed_e2e.py

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
