services:
  mysql:
    image: mysql:8.0
    container_name: skyoj-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oj_db}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    expose:
      - "3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot --password=\"$$MYSQL_ROOT_PASSWORD\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - skyoj-net

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: skyoj-backend
    expose:
      - "5000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      # 临时保留：当前判题服务直接通过 Docker SDK 创建沙箱容器。
      # 里程碑 2 将判题迁移至独立 Judge Worker，届时必须从 API 服务移除。
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/uploads:/app/uploads
      - ./skyoj_plagiarism_model:/skyoj_plagiarism_model
      - ./skyoj_searching_model:/skyoj_searching_model
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - skyoj-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: skyoj-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - skyoj-net

volumes:
  mysql_data:

networks:
  skyoj-net:
    driver: bridge
