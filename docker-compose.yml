services:
  mysql:
    image: mysql:8.0
    container_name: skyoj-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oj_db}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    expose:
      - "3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot --password=\"$$MYSQL_ROOT_PASSWORD\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - skyoj-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: skyoj-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    expose:
      - "5672"
      - "15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - skyoj-net

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: skyoj-backend
    expose:
      - "5000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skyoj-net

  job-recovery:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: skyoj-job-recovery
    command:
      - python
      - -m
      - app.workers.job_recovery
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      JOB_RECOVERY_INTERVAL_SECONDS: ${JOB_RECOVERY_INTERVAL_SECONDS:-30}
      PYTHONUNBUFFERED: "1"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skyoj-net

  judge-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: skyoj-judge-worker
    command:
      - celery
      - -A
      - app.messaging.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=judge
      - --pool=solo
      - --concurrency=1
      - --hostname=judge@%h
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skyoj-net

  ai-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: skyoj-ai-worker
    command:
      - celery
      - -A
      - app.messaging.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=ai
      - --pool=solo
      - --concurrency=1
      - --hostname=ai@%h
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skyoj-net

  file-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: skyoj-file-worker
    command:
      - celery
      - -A
      - app.messaging.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=file
      - --pool=solo
      - --concurrency=1
      - --hostname=file@%h
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skyoj-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: skyoj-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - skyoj-net

volumes:
  mysql_data:

networks:
  skyoj-net:
    driver: bridge
